<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="bugbearBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#991b1b"/>
      <stop offset="100%" stop-color="#450a0a"/>
    </radialGradient>
    <linearGradient id="bronzeBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="50%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
  </defs>

  <!-- Base Token Circle with Spiked/Iron Border -->
  <circle cx="50" cy="50" r="46" fill="url(#bugbearBg)" stroke="url(#bronzeBorder)" stroke-width="6"/>

  <!-- Bugbear Furry Head -->
  <circle cx="50" cy="40" r="22" fill="#713f12" stroke="#451a03" stroke-width="2"/>
  <!-- Pointy Goblinoid Ears -->
  <polygon points="26,36 14,24 28,44" fill="#854d0e" stroke="#451a03" stroke-width="1.5"/>
  <polygon points="74,36 86,24 72,44" fill="#854d0e" stroke="#451a03" stroke-width="1.5"/>

  <!-- Fierce Glowing Red Eyes -->
  <polygon points="40,36 44,38 40,40" fill="#f87171"/>
  <polygon points="60,36 56,38 60,40" fill="#f87171"/>

  <!-- Snout and Sharp Tusks -->
  <ellipse cx="50" cy="48" rx="10" ry="6" fill="#451a03"/>
  <polygon points="44,48 46,42 48,48" fill="#fef08a"/>
  <polygon points="56,48 54,42 52,48" fill="#fef08a"/>

  <!-- Heavy Spiked Pauldrons -->
  <path d="M 16 82 C 20 60 34 54 50 54 C 66 54 80 60 84 82 C 68 90 32 90 16 82 Z" fill="#3f3f46" stroke="#18181b" stroke-width="2"/>
  <polygon points="28,58 32,50 36,60" fill="#d4d4d8"/>
  <polygon points="72,58 68,50 64,60" fill="#d4d4d8"/>
</svg>
