<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="goblinBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#14532d"/>
    </radialGradient>
    <linearGradient id="greenBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="50%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
  </defs>

  <!-- Base Token Circle with Emerald Green Border -->
  <circle cx="50" cy="50" r="46" fill="url(#goblinBg)" stroke="url(#greenBorder)" stroke-width="6"/>

  <!-- Big Goblin Ears -->
  <polygon points="26,42 6,32 24,56" fill="#4ade80" stroke="#166534" stroke-width="1.5"/>
  <polygon points="74,42 94,32 76,56" fill="#4ade80" stroke="#166534" stroke-width="1.5"/>

  <!-- Goblin Head -->
  <ellipse cx="50" cy="42" rx="20" ry="18" fill="#4ade80" stroke="#166534" stroke-width="2"/>

  <!-- Yellow Shifty Eyes -->
  <ellipse cx="42" cy="38" rx="4" ry="5" fill="#facc15"/>
  <ellipse cx="58" cy="38" rx="4" ry="5" fill="#facc15"/>
  <circle cx="43" cy="38" r="2" fill="#0f172a"/>
  <circle cx="57" cy="38" r="2" fill="#0f172a"/>

  <!-- Wide Grin with Pointy Teeth -->
  <path d="M 38 48 Q 50 58 62 48 Z" fill="#14532d"/>
  <polygon points="42,48 44,52 46,48" fill="#ffffff"/>
  <polygon points="48,48 50,53 52,48" fill="#ffffff"/>
  <polygon points="54,48 56,52 58,48" fill="#ffffff"/>

  <!-- Leather vest and Scavenged Gear -->
  <path d="M 24 82 C 28 62 36 58 50 58 C 64 58 72 62 76 82 C 65 88 35 88 24 82 Z" fill="#78350f" stroke="#451a03" stroke-width="2"/>
  <path d="M 36 62 L 48 82 M 64 62 L 52 82" stroke="#d97706" stroke-width="2"/>
</svg>
