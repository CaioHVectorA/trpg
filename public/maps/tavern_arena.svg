<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <defs>
    <!-- Wooden Planks Pattern -->
    <pattern id="woodPlanks" width="120" height="40" patternUnits="userSpaceOnUse">
      <rect width="120" height="40" fill="#291e13"/>
      <path d="M 0 0 L 120 0 M 0 40 L 120 40" stroke="#1c140c" stroke-width="2"/>
      <path d="M 60 0 L 60 40" stroke="#1c140c" stroke-width="1.5"/>
      <rect x="2" y="2" width="56" height="36" fill="#36281a" rx="1"/>
      <rect x="62" y="2" width="56" height="36" fill="#312316" rx="1"/>
      <circle cx="20" cy="20" r="1.5" fill="#1c140c"/>
      <circle cx="80" cy="20" r="1.5" fill="#1c140c"/>
    </pattern>

    <!-- Warm Fireplace Light Radial Gradient -->
    <radialGradient id="hearthLight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.9"/>
      <stop offset="25%" stop-color="#ea580c" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#9a3412" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Tavern Floor -->
  <rect width="1200" height="900" fill="url(#woodPlanks)"/>

  <!-- Thick Timber Walls -->
  <rect x="10" y="10" width="1180" height="880" fill="none" stroke="#451a03" stroke-width="20" rx="12"/>
  <rect x="25" y="25" width="1150" height="850" fill="none" stroke="#78350f" stroke-width="6" rx="8"/>

  <!-- Fireplace Hearth (Top Center) -->
  <rect x="520" y="25" width="160" height="50" fill="#1c1917" stroke="#78716c" stroke-width="4"/>
  <circle cx="600" cy="50" r="180" fill="url(#hearthLight)"/>
  <ellipse cx="600" cy="50" rx="40" ry="20" fill="#f97316"/>
  <ellipse cx="600" cy="50" rx="20" ry="10" fill="#fef08a"/>

  <!-- The Bar / Counter (Left side) -->
  <path d="M 60 160 L 260 160 L 260 480 L 160 480 L 160 260 L 60 260 Z" fill="#451a03" stroke="#78350f" stroke-width="4"/>
  <!-- Bar Stools -->
  <circle cx="290" cy="200" r="16" fill="#78350f" stroke="#b45309" stroke-width="2"/>
  <circle cx="290" cy="270" r="16" fill="#78350f" stroke="#b45309" stroke-width="2"/>
  <circle cx="290" cy="340" r="16" fill="#78350f" stroke="#b45309" stroke-width="2"/>
  <circle cx="290" cy="410" r="16" fill="#78350f" stroke="#b45309" stroke-width="2"/>

  <!-- Round Tavern Tables & Chairs -->
  <!-- Table 1 (Center-Right) -->
  <circle cx="700" cy="340" r="60" fill="#5c2d12" stroke="#78350f" stroke-width="4"/>
  <circle cx="700" cy="340" r="45" fill="#78350f"/>
  <circle cx="620" cy="340" r="16" fill="#451a03"/>
  <circle cx="780" cy="340" r="16" fill="#451a03"/>
  <circle cx="700" cy="260" r="16" fill="#451a03"/>
  <circle cx="700" cy="420" r="16" fill="#451a03"/>

  <!-- Table 2 (Center-Bottom) -->
  <circle cx="500" cy="620" r="70" fill="#5c2d12" stroke="#78350f" stroke-width="4"/>
  <circle cx="500" cy="620" r="55" fill="#78350f"/>
  <circle cx="410" cy="620" r="16" fill="#451a03"/>
  <circle cx="590" cy="620" r="16" fill="#451a03"/>
  <circle cx="500" cy="530" r="16" fill="#451a03"/>
  <circle cx="500" cy="710" r="16" fill="#451a03"/>

  <!-- Table 3 (Bottom-Right) -->
  <circle cx="950" cy="620" r="60" fill="#5c2d12" stroke="#78350f" stroke-width="4"/>
  <circle cx="950" cy="620" r="45" fill="#78350f"/>
  <circle cx="870" cy="620" r="16" fill="#451a03"/>
  <circle cx="1030" cy="620" r="16" fill="#451a03"/>
  <circle cx="950" cy="540" r="16" fill="#451a03"/>
  <circle cx="950" cy="700" r="16" fill="#451a03"/>

  <!-- Ale Barrels (Top Right) -->
  <ellipse cx="1060" cy="120" rx="30" ry="20" fill="#78350f" stroke="#451a03" stroke-width="3"/>
  <ellipse cx="1120" cy="120" rx="30" ry="20" fill="#78350f" stroke="#451a03" stroke-width="3"/>
  <ellipse cx="1090" cy="160" rx="30" ry="20" fill="#78350f" stroke="#451a03" stroke-width="3"/>
</svg>
